[build-system]
requires = [
    "setuptools==83.0.0",
    "wheel==0.47.0",
    "cython==3.2.8",
    "numpy==1.26.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "madmom"
version = "0.17.dev0"
description = "Python audio signal processing library"
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    { name = "Department of Computational Perception, Johannes Kepler University, Linz, Austria and Austrian Research Institute for Artificial Intelligence (OFAI), Vienna, Austria", email = "madmom-users@googlegroups.com" },
]
license = "BSD-3-Clause AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.13",
    "mido>=1.2.6",
]
classifiers = [
    "Development Status :: 3 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/CPJKU/madmom"
Source = "https://github.com/CPJKU/madmom"

[tool.setuptools]
include-package-data = false
script-files = [
    "bin/BarTracker",
    "bin/BeatDetector",
    "bin/BeatTracker",
    "bin/CNNChordRecognition",
    "bin/CNNOnsetDetector",
    "bin/ComplexFlux",
    "bin/CRFBeatDetector",
    "bin/DBNBeatTracker",
    "bin/DBNDownBeatTracker",
    "bin/DCChordRecognition",
    "bin/evaluate",
    "bin/GMMPatternTracker",
    "bin/KeyRecognition",
    "bin/LogFiltSpecFlux",
    "bin/MMBeatTracker",
    "bin/OnsetDetector",
    "bin/OnsetDetectorLL",
    "bin/PianoTranscriptor",
    "bin/PickleProcessor",
    "bin/SpectralOnsetDetection",
    "bin/SuperFlux",
    "bin/SuperFluxNN",
    "bin/TCNBeatTracker",
    "bin/TCNTempoDetector",
    "bin/TempoDetector",
    "bin/TorchBeatTracker",
]

[tool.setuptools.packages.find]
include = ["madmom*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
madmom = [
    "models/LICENSE",
    "models/README.rst",
    "models/beats/201[569]/*",
    "models/chords/*/*",
    "models/chroma/*/*",
    "models/downbeats/*/*",
    "models/key/2018/*",
    "models/notes/*/*",
    "models/onsets/*/*",
    "models/patterns/*/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["tests", "docs"]

[tool.setuptools.dynamic]
readme = { file = ["README.rst", "CHANGES.rst"], content-type = "text/x-rst" }

[tool.pytest.ini_options]
# The suite deliberately exercises legacy API compatibility and undefined
# numerical edge cases. Keep those exact, reviewed warnings out of normal test
# output while allowing every unrecognized warning to remain visible.
filterwarnings = [
    'ignore:^Deprecated as of version 0\.16\. Please use madmom\.io\.midi instead\..*:UserWarning',
    'ignore:^Deprecated as of version 0\.16\. Please use madmom\.io\.audio\.write_wave_file instead\..*:UserWarning',
    "ignore:^`circular_shift` of the STFT must be set to 'True' for correct phase$:RuntimeWarning",
    'ignore:^Please update your GRU models by loading them and saving them again\..*:RuntimeWarning',
    'ignore:^Usage of `method` is deprecated as of version 0\.17\..*:UserWarning',
    'ignore:^make sure that the `frame_size` \(2048\) is equal to the maximum value used by any `FramedSignalProcessor`\.$:UserWarning',
    'ignore:^Please update your GMM models by loading them and saving them again\..*:UserWarning',
    'ignore:^Not enough beat annotations \(\d+\) for \d+ histogram bins\.$:UserWarning',
    'ignore:^annotated tempo strengths do not sum to 1, normalizing$:UserWarning',
    'ignore:^no annotated tempo strengths given, assuming a uniform distribution$:UserWarning',
    'ignore:^Mean of empty slice$:RuntimeWarning:madmom\.evaluation.*',
    'ignore:^mean_error is given for all notes, this will change!$:UserWarning',
    'ignore:^std_error is given for all notes, this will change!$:UserWarning',
    'ignore:^divide by zero encountered in log$:RuntimeWarning:madmom\.features\.beats_hmm$',
    'ignore:^divide by zero encountered in log$:RuntimeWarning:.*test_ml_hmm$',
    'ignore:^-inf log probability during Viterbi decoding cannot find a valid path$:RuntimeWarning',
    'ignore:^invalid value encountered in log$:RuntimeWarning:madmom\.features\.beats_hmm$',
    'ignore:^Beat sequence too long compared to features\.$:UserWarning',
    'ignore:^`mirex` argument is deprecated as of version 0\.16 and will be removed in version 0\.17\..*:UserWarning',
    'ignore:^`shift` parameter is deprecated as of version 0\.16 and will be removed in version 0\.18\..*:UserWarning',
]
