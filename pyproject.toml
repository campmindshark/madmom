[build-system]
requires = [
    "setuptools==83.0.0",
    "wheel==0.47.0",
    "cython==3.2.8",
    "numpy==1.26.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "madmom"
version = "0.17.dev0"
description = "Spectrum's private online RNN/DBN beat tracker"
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    { name = "Department of Computational Perception, Johannes Kepler University, Linz, Austria and Austrian Research Institute for Artificial Intelligence (OFAI), Vienna, Austria", email = "madmom-users@googlegroups.com" },
]
license = "BSD-3-Clause AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.13",
]
classifiers = [
    "Development Status :: 3 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/CPJKU/madmom"
Source = "https://github.com/CPJKU/madmom"

[tool.setuptools]
include-package-data = false
script-files = [
    "bin/DBNBeatTracker",
]

[tool.setuptools.packages.find]
include = [
    "madmom",
    "madmom.audio",
    "madmom.features",
    "madmom.io",
    "madmom.ml",
    "madmom.ml.nn",
    "madmom.models",
    "madmom.utils",
]

[tool.setuptools.package-data]
madmom = [
    "models/LICENSE",
    "models/README.rst",
    "models/beats/2016/beats_lstm_[1-8].pkl",
]

[tool.setuptools.exclude-package-data]
"*" = ["tests", "docs"]

[tool.setuptools.dynamic]
readme = { file = ["README.rst"], content-type = "text/x-rst" }

[tool.pytest.ini_options]
testpaths = ["tests/test_spectrum_boundary.py"]
